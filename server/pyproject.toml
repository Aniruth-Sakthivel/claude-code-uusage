[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meterhouse-server"
version = "0.1.0"
description = "Meterhouse central API — multi-user usage monitoring platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "supabase>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.core", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
