<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Centralized Claude Code token usage monitoring across your fleet of PCs."
    />
    <title>ClaudeFleet — Usage Monitor</title>
    <script>
      // Apply the stored theme before first paint, so there is no flash of the
      // wrong theme while React boots.
      (function () {
        try {
          var t = localStorage.getItem("cf_theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          /* private mode — fall back to the CSS default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
