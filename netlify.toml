# Netlify configuration — deploys BOTH the dashboard and the API.
#
# The previous Python backend could not run here (Netlify has no persistent
# process), so it needed a separate paid host plus a proxy rule. The Node API
# runs as a serverless function, so the whole product is one deploy and one
# origin — which also means no CORS configuration.

[build]
  command = "npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pg ships native bindings that must not be bundled.
  external_node_modules = ["pg", "pg-native"]

[functions."api"]
  # Sync batches and cold starts occasionally exceed the 10s default.
  timeout = 26

# --- API ---------------------------------------------------------------------
# Every /api/* request is served by the Fastify function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# --- SPA fallback ------------------------------------------------------------
# React Router owns the client-side routes. This must come AFTER the API rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers --------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The install script is generated per-enrollment and single-use; never cache it.
[[headers]]
  for = "/api/v1/connect/script/*"
  [headers.values]
    Cache-Control = "no-store"
