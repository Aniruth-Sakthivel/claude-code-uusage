name: Publish agent to PyPI

# Builds the meterhouse-rotor sdist/wheel and publishes to PyPI whenever a tag
# matching agent-v* is pushed — the same trigger as the .exe release workflow.
# Uses PyPI Trusted Publishing (OIDC) — no stored API token needed. One-time
# setup: register this repo/workflow/environment at
# https://pypi.org/manage/account/publishing/ (owner=Aniruth-Sakthivel,
# repo=claude-code-uusage, workflow=publish-agent.yml, environment=pypi).
#
# Cut a release (same tag triggers both this and release-agent.yml):
#   git tag agent-v0.1.0
#   git push origin agent-v0.1.0

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agent/dist
