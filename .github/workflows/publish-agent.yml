name: Publish agent to PyPI

# Builds the meterhouse-rotor sdist/wheel and publishes to PyPI whenever a tag
# matching agent-v* is pushed — the same trigger as the .exe release workflow.
# Uses a PyPI API token from GitHub Actions secrets rather than trusted publishing.
#
# One-time setup required before this works: create a repository secret named
# PYPI_API_TOKEN with a token from https://pypi.org/manage/account/token/
#
# Cut a release (same tag triggers both this and release-agent.yml):
#   git tag agent-v0.1.0
#   git push origin agent-v0.1.0

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agent/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
