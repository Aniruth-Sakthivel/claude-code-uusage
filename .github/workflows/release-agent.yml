name: Release agent exe

# Builds a standalone Windows meterhouse.exe (via PyInstaller) and attaches it
# to a GitHub Release whenever a tag matching agent-v* is pushed. The exe needs
# no Python/pip/git on the end user's PC — it's what the generated install
# command in onboarding.ts downloads and runs directly.
#
# Cut a release:
#   git tag agent-v0.1.0
#   git push origin agent-v0.1.0

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build meterhouse.exe
        run: >
          python -m PyInstaller --onefile --name meterhouse --console --clean
          --distpath dist --workpath build --specpath . entry.py

      - name: Smoke test
        run: .\dist\meterhouse.exe --version

      - name: Run test suite against the source (not the exe)
        run: |
          python -m pip install --quiet pytest
          python -m pytest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/meterhouse.exe
          fail_on_unmatched_files: true
