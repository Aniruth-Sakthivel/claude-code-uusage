name: platform CI

on:
  push:
    branches: [main, prod-development]
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]

defaults:
  run:
    working-directory: platform

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Unit tests
        run: pnpm turbo test

  # A separate, independently-required check.
  #
  # A cross-workspace leak is the failure mode this codebase is organized
  # around, so its gate is visible in the checks list on its own rather than
  # buried inside a green "tests" tick. Disabling it should require an explicit,
  # visible decision.
  tenancy:
    name: tenancy isolation (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Poison-row suite
        run: pnpm turbo test:tenancy
