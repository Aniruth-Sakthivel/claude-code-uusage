[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meterhouse-rotor"
version = "0.2.1"
description = "Rotor — the Meterhouse metering agent. Reads Claude Code usage on this machine and reports it to your Meterhouse dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Meterhouse" }]
keywords = ["meterhouse", "rotor", "claude-code", "agent", "usage", "sync", "dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Local mode is pure stdlib. `sync` (central mode) adds a small HTTP client dep
# in a later phase via the [sync] extra.
dependencies = []

[project.optional-dependencies]
sync = ["httpx>=0.27"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]
# Powers `meterhouse daemon`'s WebSocket push. Local/REST modes stay
# dependency-free on purpose; this is the one opt-in exception.
realtime = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/Aniruth-Sakthivel/claude-code-uusage"
Repository = "https://github.com/Aniruth-Sakthivel/claude-code-uusage"
Documentation = "https://github.com/Aniruth-Sakthivel/claude-code-uusage#readme"

[project.scripts]
meterhouse = "meterhouse.cli:main"

[tool.setuptools]
packages = ["meterhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
