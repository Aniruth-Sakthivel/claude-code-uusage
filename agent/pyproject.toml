[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claudefleet-agent"
version = "0.1.0"
description = "ClaudeFleet local agent — scans Claude Code usage and syncs to the central platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# Local mode is pure stdlib. `sync` (central mode) adds a small HTTP client dep
# in a later phase via the [sync] extra.
dependencies = []

[project.optional-dependencies]
sync = ["httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
claudefleet = "claudefleet.cli:main"

[tool.setuptools]
packages = ["claudefleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
